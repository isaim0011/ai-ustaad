<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b18" class="bg-stop-0" />
      <stop offset="100%" stop-color="#141413" class="bg-stop-1" />
    </linearGradient>
    <linearGradient id="auAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e07a5f" />
      <stop offset="50%" stop-color="#c96442" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="auCircuit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c96442" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @media (prefers-color-scheme: light) {
      .bg-stop-0 { stop-color: #262522; }
      .bg-stop-1 { stop-color: #1a1917; }
    }

    .circuit-ring {
      stroke-dasharray: 6 10;
      animation: rotateRing 14s linear infinite;
      transform-origin: 32px 32px;
    }

    .pulse-node {
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    .pulse-node-delay {
      animation: pulseGlow 3s ease-in-out 1.5s infinite alternate;
    }

    .trace-glow {
      stroke-dasharray: 60;
      stroke-dashoffset: 120;
      animation: traceFlow 4s ease-in-out infinite;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0% { r: 2; opacity: 0.6; }
      50% { r: 2.8; opacity: 1; filter: drop-shadow(0 0 2px #10b981); }
      100% { r: 2; opacity: 0.6; }
    }

    @keyframes traceFlow {
      0% { stroke-dashoffset: 120; opacity: 0.4; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.4; }
    }
  </style>

  <!-- Container with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#auBg)" stroke="#c96442" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Neural Accent Ring / Geometric Grid (Rotating) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#auCircuit)" stroke-width="1.2" stroke-opacity="0.3" class="circuit-ring" />

  <!-- Animated Monogram AU -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M 17 46 L 26 18 L 35 46" fill="none" stroke="url(#auAccent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 20.5 36 L 31.5 36" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" class="trace-glow" />
    
    <!-- Letter U (interlocking right arm) -->
    <path d="M 35 27 L 35 38 C 35 44, 45 44, 45 38 L 45 22" fill="none" stroke="#f5f4ed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Neural Synapse Nodes -->
  <circle cx="26" cy="18" r="2.4" fill="#e07a5f" class="pulse-node" />
  <circle cx="20.5" cy="36" r="2" fill="#10b981" class="pulse-node-delay" />
  <circle cx="31.5" cy="36" r="2" fill="#10b981" class="pulse-node" />
  <circle cx="45" cy="22" r="2.2" fill="#10b981" class="pulse-node-delay" />
  <circle cx="35" cy="27" r="1.8" fill="#c96442" class="pulse-node" />
</svg>