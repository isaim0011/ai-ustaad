<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b18" />
      <stop offset="50%" stop-color="#141413" />
      <stop offset="100%" stop-color="#0c0b0a" />
    </linearGradient>

    <!-- Terracotta Accent Gradient -->
    <linearGradient id="accentTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e07a5f" />
      <stop offset="50%" stop-color="#c96442" />
      <stop offset="100%" stop-color="#a8482a" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Radial Glow behind logo -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c96442" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#141413" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262522" stroke-width="1" stroke-opacity="0.6" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Neural Grid -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <rect width="1200" height="630" fill="url(#centerGlow)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#343330" stroke-width="1.5" />
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="url(#accentTerracotta)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Top Bar: Logo & Badge -->
  <g transform="translate(80, 75)">
    <!-- Monogram AU Icon Box -->
    <rect width="64" height="64" rx="14" fill="#1f1e1b" stroke="#c96442" stroke-width="1.5" />
    <!-- Monogram Lines -->
    <path d="M 18 47 L 27 19 L 36 47" fill="none" stroke="url(#accentTerracotta)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 21.5 37 L 32.5 37" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 36 28 L 36 39 C 36 45, 46 45, 46 39 L 46 23" fill="none" stroke="#f5f4ed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Site Title & Subtitle -->
    <text x="82" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f4ed" letter-spacing="-0.5">AI Ustaad</text>
    <text x="82" y="52" font-family="'JetBrains Mono', monospace, Consolas, sans-serif" font-size="13" font-weight="500" fill="#a19f97" letter-spacing="1">ZERO SE PRODUCTION TAK</text>

    <!-- Top-Right Category Pill -->
    <g transform="translate(800, 10)">
      <rect width="240" height="38" rx="19" fill="#1f1e1b" stroke="#c96442" stroke-width="1" stroke-opacity="0.4" />
      <text x="120" y="24" font-family="'JetBrains Mono', monospace, Consolas, sans-serif" font-size="12" font-weight="600" fill="#e07a5f" text-anchor="middle" letter-spacing="1">ROMAN URDU CURRICULUM</text>
    </g>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(80, 230)">
    <text x="0" y="0" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#f5f4ed" letter-spacing="-1">
      AI Mastery: Zero Se Production Tak
    </text>

    <text x="0" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#a19f97">
      South Asia's First Complete, Production-Grade AI Engineering Curriculum
    </text>

    <text x="0" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6f6e69">
      Hands-on practical code, zero-GPU cloud recipes, and production deployment architecture.
    </text>
  </g>

  <!-- Technology Badges Row -->
  <g transform="translate(80, 420)">
    <!-- Badge 1: PyTorch -->
    <g transform="translate(0, 0)">
      <rect width="140" height="42" rx="10" fill="#1f1e1b" stroke="#343330" stroke-width="1" />
      <text x="70" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#f5f4ed" text-anchor="middle">PyTorch Tensors</text>
    </g>

    <!-- Badge 2: Transformers -->
    <g transform="translate(155, 0)">
      <rect width="135" height="42" rx="10" fill="#1f1e1b" stroke="#343330" stroke-width="1" />
      <text x="67" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#f5f4ed" text-anchor="middle">Transformers</text>
    </g>

    <!-- Badge 3: Modern RAG -->
    <g transform="translate(305, 0)">
      <rect width="130" height="42" rx="10" fill="#1f1e1b" stroke="#343330" stroke-width="1" />
      <text x="65" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#f5f4ed" text-anchor="middle">Modern RAG</text>
    </g>

    <!-- Badge 4: DeepSeek-R1 GRPO -->
    <g transform="translate(450, 0)">
      <rect width="180" height="42" rx="10" fill="#1f1e1b" stroke="#c96442" stroke-width="1" stroke-opacity="0.6" />
      <text x="90" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#e07a5f" text-anchor="middle">DeepSeek-R1 GRPO</text>
    </g>

    <!-- Badge 5: Anthropic MCP -->
    <g transform="translate(645, 0)">
      <rect width="145" height="42" rx="10" fill="#1f1e1b" stroke="#343330" stroke-width="1" />
      <text x="72" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#f5f4ed" text-anchor="middle">Anthropic MCP</text>
    </g>

    <!-- Badge 6: Rust Axum -->
    <g transform="translate(805, 0)">
      <rect width="125" height="42" rx="10" fill="#1f1e1b" stroke="#343330" stroke-width="1" />
      <text x="62" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#10b981" text-anchor="middle">Rust Axum</text>
    </g>

    <!-- Badge 7: Zero-GPU -->
    <g transform="translate(945, 0)">
      <rect width="95" height="42" rx="10" fill="#1f1e1b" stroke="#343330" stroke-width="1" />
      <text x="47" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#a19f97" text-anchor="middle">Zero-GPU</text>
    </g>
  </g>

  <!-- Bottom Bar: Canonical URL & Author -->
  <g transform="translate(80, 535)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#262522" stroke-width="1" />
    <text x="0" y="32" font-family="'JetBrains Mono', monospace, Consolas, sans-serif" font-size="15" font-weight="500" fill="#c96442">https://ai-ustaad.pages.dev</text>
    <text x="1040" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#6f6e69" text-anchor="end">Created by Bimo (isaim0011)</text>
  </g>
</svg>
