<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1e1d" />
      <stop offset="100%" stop-color="#141413" />
    </linearGradient>
    <linearGradient id="auAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e07a5f" />
      <stop offset="50%" stop-color="#c96442" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#auBg)" stroke="#c96442" stroke-opacity="0.35" stroke-width="1.5" />
  
  <!-- Neural Accent Ring / Geometric Grid -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#c96442" stroke-opacity="0.12" stroke-dasharray="3 3" />

  <!-- Monogram AU -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M 18 45 L 26 19 L 34 45" fill="none" stroke="url(#auAccent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 21.5 35 L 30.5 35" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Letter U (interlocking right arm) -->
    <path d="M 35 27 L 35 38 C 35 43, 44 43, 44 38 L 44 24" fill="none" stroke="#f5f4ed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Neural Synapse Nodes -->
  <circle cx="26" cy="19" r="2.5" fill="#e07a5f" />
  <circle cx="21.5" cy="35" r="1.8" fill="#10b981" />
  <circle cx="30.5" cy="35" r="1.8" fill="#10b981" />
  <circle cx="44" cy="24" r="2.2" fill="#10b981" />
</svg>
