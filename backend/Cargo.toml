[package]
name = "ai-mastery-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

dkit-core = { path = "C:/Users/Bimo/Desktop/diagramkit/crates/dkit-core" }
dkit-diagram = { path = "C:/Users/Bimo/Desktop/diagramkit/crates/dkit-diagram" }
dkit-api = { path = "C:/Users/Bimo/Desktop/diagramkit/crates/dkit-api" }
